<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="多平台 NAS 音乐播放器。连接你自己的音乐服务器，在任意设备上听自己的库。">

  <!--
    外壳身份这几样是本仓库自己填的,不再等于 flutter create 模板(见
    docs/CHANGELOG.md 第十三轮)。口径:
      - 名字 = Nordic,真值取 android/app/src/main/AndroidManifest.xml 的
        android:label,其余各处向它看齐;
      - 图标与 favicon 由 tool/app_icon.py 生成(与 Android 那份同一个矢量源);
      - manifest.json 的两个颜色 = #07070C,与 nordic_bg / NordicTokens.dark.bg
        同一条口径 —— 启动那一下不该先闪一层 Flutter 蓝。
    manifest.json 是 JSON,写不了注释,所以口径记在这里。
  -->
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nordic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    下面那条 <title> 只管**加载期**:应用起来之后引擎会用 MaterialApp.title
    (lib/app.dart:33 已经是 Nordic)把 document.title 盖掉。而上面那条
    apple-mobile-web-app-title 不会被盖 —— 「装到 iOS 主屏上叫什么」看的是它。
  -->
  <title>Nordic</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    **别往这里加运行时的 CDN 脚本。**

    `tool/build.sh web` 里有一条守卫:产物里出现那几家 CDN 的域名就直接失败 ——
    运行时的脚本取不到时表现是**卡住、不报错**,与 CanvasKit 从 www.gstatic.com
    取不到是同一种失败(见那一节的上一条)。最容易撞上这条的一次,是「为了让 web
    也能扫码」而加一行第三方的扫码库:web 上**刻意不扫码**,没摄像头、或浏览器
    不支持的,一律走粘贴文本(见 lib/data/scan_capability.dart)。

    那条守卫是**按字面找域名**的,所以这段说明里也不能把那几个域名写出来 ——
    写了,守卫会把这一段自己认出来、构建当场失败。那几个字面量写在
    tool/build.sh 的 standardize_web 第 5 条里,要改这段先看那儿。

    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
